# NAS 用（Synology Container Manager／QNAP Container Station）
# 這個檔案所在的資料夾就是「程式資料夾」，底下的 data、output、corrections、config.yaml、.env 都以這裡為準。
# 搬動資料夾後：整個程式資料夾一起搬，再把「任務排程表」裡的 cd 路徑改成新位置，最後執行一次自我檢查：
#   cd /新的路徑/display-intel && docker compose run --rm agent doctor
#
# 任務排程表（使用者 root，台灣時間）：
#   週一、二、三、五 19:17：cd /volume1/docker/display-intel && docker compose run --rm agent collect
#   週日 19:17：            cd /volume1/docker/display-intel && docker compose run --rm agent run
#   （週二會自動做規格補完、週日做完整蒐集並等到 22:00 寄出週報）
services:
  agent:
    build: .
    env_file: .env                          # 金鑰（照 .env.example 填寫，不要上傳到 GitHub）
    environment:
      - TZ=Asia/Taipei
    volumes:
      - ./data:/app/data                    # 資料庫（最重要，請定期備份）
      - ./output:/app/output                # 週報 HTML 與 Excel（可改成 NAS 的共用資料夾路徑）
      - ./corrections:/app/corrections      # 人工更正 Excel／CSV（放進這個資料夾就生效）
      - ./config.yaml:/app/config.yaml      # 設定
    command: ["run"]
