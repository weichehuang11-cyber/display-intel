# 每週日產生週報，22:00 準時寄出（台灣時間 21:17 啟動，預留 GitHub 排程延遲的緩衝）
# 寄出前會檢查今天的週日完整蒐集有沒有跑（GitHub 偶爾會漏排程），沒跑就先補跑
# 想改回每天：cron 改成 "47 0 * * *"，並把 config.yaml 的 cadence 改成 daily、send_at 改成 "09:30"
name: 2. 每週報告

on:
  schedule:
    - cron: "17 13 * * 0"   # 每週日 UTC 13:17 = 台灣時間週日 21:17
  workflow_dispatch:
    inputs:
      mode:
        description: "test = 只產生報告不寄信；now = 立刻寄出；scheduled = 照排程（補跑週日蒐集、等到 22:00、已寄過就跳過，NAS 觸發用）"
        type: choice
        options: [test, now, scheduled]
        default: test

permissions:
  contents: write

concurrency:
  group: database
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 產生並寄送報告
        env:
          PYTHONPATH: src
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}   # 週日完整蒐集漏跑時補跑用
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REPORT_RECIPIENTS: ${{ secrets.REPORT_RECIPIENTS }}
        run: |
          if [ "${{ inputs.mode }}" = "test" ]; then
            python -m display_intel report --dry-run
          elif [ "${{ inputs.mode }}" = "now" ]; then
            python -m display_intel report --no-wait
          else
            # 排程寄送（GitHub 排程或 NAS 準時觸發）：今天已寄過就跳過；週日完整蒐集漏跑就先補跑，等到 22:00 寄出
            python -m display_intel report --ensure-full --skip-if-done
          fi
      - name: 保存報告檔（可在 Actions 頁面下載）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ github.run_id }}
          path: output/
          retention-days: 30
      - name: 儲存資料庫
        if: always() && inputs.mode != 'test'
        run: |
          git config user.name "display-intel-bot"
          git config user.email "display-intel-bot@users.noreply.github.com"
          git add data/intel.sqlite 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "data: 週報已寄出 $(TZ=Asia/Taipei date +%F)"
          git pull --rebase -X theirs || true
          git push
