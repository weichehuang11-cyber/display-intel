# 週一、三、五、日 台灣時間 19:17 蒐集新聞並萃取規格（不寄信）
# 週一三五是輕量蒐集（回看 2 天）；週日是完整蒐集（回看 7 天），21:35 前收工，接著產生週報
# 每次蒐集後會自動補查缺少規格的機型；手動選 enrich 可只做補查
# 11/1 起每次蒐集也會順便回溯過去幾季的資料；手動選 backfill 可立刻回溯
# 模式與用量在 config.yaml 的 collection 區塊設定
name: 1. 定期蒐集

on:
  schedule:
    - cron: "17 11 * * 0,1,3,5"   # 週日、一、三、五 UTC 11:17 = 台灣時間 19:17
  workflow_dispatch:          # 允許在 Actions 頁面手動執行
    inputs:
      profile:
        description: "auto = 依星期自動；light = 輕量；full = 完整（回看 7 天）；enrich = 只補查缺少的規格；backfill = 只做歷史回溯"
        type: choice
        options: [auto, light, full, enrich, backfill]
        default: auto

permissions:
  contents: write   # 把資料庫存回 repo

concurrency:
  group: database
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 蒐集、萃取、查核
        env:
          PYTHONPATH: src
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: python -m display_intel collect --profile "${{ inputs.profile || 'auto' }}"
      - name: 儲存資料庫
        if: always()
        run: |
          git config user.name "display-intel-bot"
          git config user.email "display-intel-bot@users.noreply.github.com"
          git add data/intel.sqlite 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "data: 蒐集 $(TZ=Asia/Taipei date +%F)"
          git pull --rebase -X theirs || true
          git push
