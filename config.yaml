# 顯示器情報 Agent 設定檔
# 非工程人員也可以修改這個檔案：新增來源、關鍵字、調整時間。
# 修改後先執行 `python -m display_intel check-sources` 確認來源可以連線。

schedule:
  # cadence：weekly = 每週寄一次週報；daily = 每天寄日報
  # 改頻率時，也要同步改 .github/workflows/report.yml 的 cron 時間（教學有說明）
  cadence: weekly
  timezone: Asia/Taipei
  send_at: "22:00"          # 寄出時間（週報：每週日 22:00）
  collect_deadline: "21:35" # 蒐集與萃取最晚到這個時間收工，把資料交給報告階段

# 蒐集排程：週一、三、五 19:17 輕量蒐集（不寄信），週二專做規格補完，週日完整蒐集後寄週報
# 規格補完：針對缺少規格的機型，再搜尋官方規格頁與評測。
# Gemini 免費額度每天重置，週日完整蒐集會用掉大部分，所以大量補完放在週二用另一天的額度
collection:
  full_day: sunday            # 哪一天做完整蒐集
  enrich_day: tuesday         # 哪一天專做規格補完（不蒐集新聞）
  light:                      # 週一、三、五輕量蒐集
    lookback_hours: 50        # 回看約 2 天
    news_window: 2d           # Google 新聞搜尋範圍
    tavily_days: 2            # Tavily 搜尋最近幾天
    tavily_queries_per_run: 10
    max_ai_calls: 30
    enrich_models: 6          # 每次補完幾款機型（每款約用 1 次 Tavily）
  full:                       # 週日完整蒐集
    lookback_hours: 170
    news_window: 7d
    tavily_time_range: week
    tavily_queries_per_run: 42
    max_ai_calls: 60
    enrich_models: 3          # 週日額度留給新聞萃取，大量補完在週二
    extract_model: gemini-3.8-flash   # 週日用較準確的模型（不能用時自動改回上方預設模型）
  backfill:                   # 只做歷史回溯（手動執行用）
    max_ai_calls: 40
  enrich:                     # 週二規格補完日（手動也可隨時執行，應付臨時需求）
    max_ai_calls: 60
    enrich_models: 30
  # 補完規則（目標：上市滿 30 天的機型規格完整度 75%）
  enrich_target: 10                   # 13 項重點規格中已知 10 項（約 75%）就不再補查，把額度留給其他機型
  enrich_schedule_days: [0, 14, 35]   # 補查時間：第一次立刻查，之後在上市第 14、35 天再查（配合評測出現）
  enrich_retry_days: 6                # 兩次補查至少間隔幾天
  enrich_within_days: 60              # 只補查 60 天內出現的機型
  panel_hunt: true                    # 缺面板型號的機型，專門到評測網站搜尋一次（每款最多 1 次 Tavily，原文掃描不花 AI）
  watch_per_run: 5                    # 每次蒐集最多幫幾款「關注機型」建檔或回查（週日加倍）
  watch_refresh_days: 30              # 關注機型每隔幾天回查一次（抓新款與規格更新）
  enrich_monthly_cap: 850             # Tavily 當月用到這個數字就暫停補查（保留餘裕給臨時需求）
  tavily_monthly_hard_cap: 950        # 新聞搜尋也停止的上限（免費額度 1,000）
  # 展會月自動加碼：1 月 CES、5–6 月 Computex、9 月 IFA
  event_months: [1, 5, 6, 9]
  event_extra_queries_per_run: 10
  # Tavily 每月 1,000 次預估：新聞搜尋每週 70 次；補完每款 2 次（評測＋官方）＋面板反查
  # 一般月份約 650–750 次；用到 850 次自動暫停補完，保留給臨時手動執行

llm:
  # ===== 免費版（預設）=====
  # Google Gemini 免費額度。金鑰申請：https://aistudio.google.com/apikey
  # 免費額度與可用模型會變動，可在 https://aistudio.google.com/rate-limit 查看。模型名稱若變動，改這裡即可。
  provider: gemini
  extract_model: gemini-3.5-flash-lite
  summary_model: gemini-3.5-flash-lite
  fallback_models: [gemini-3.8-flash, gemini-3.1-flash-lite]  # 上面的模型不能用時依序嘗試
  max_calls_per_run: 60             # 每次執行最多呼叫幾次 AI（週報一次處理一整週；額度用完會自動停止）
  min_seconds_between_calls: 15     # 每次呼叫間隔，避免超過每分鐘上限
  max_chars_per_call: 20000         # 每次送給 AI 的文字量（一次多送幾篇，省呼叫次數）
  max_chars_per_article: 3500       # 一般新聞每篇最多送給 AI 的字數
  max_chars_per_review: 8000        # 評測與官方規格頁（規格表常在後段，給較多字數）
  max_output_tokens: 8000

  # ===== 升級成 Claude（付費，品質最好）=====
  # 把上面幾行換成下面這組，並在 GitHub Secrets 加上 ANTHROPIC_API_KEY：
  # provider: anthropic
  # extract_model: claude-sonnet-5-5
  # summary_model: claude-sonnet-5-5
  # max_calls_per_run: 150
  # min_seconds_between_calls: 0
  # max_chars_per_call: 40000
  # max_chars_per_article: 8000
  # max_output_tokens: 8000

# 來源類型決定預設可信度：official=A、review=B、media=C、aggregator=C、social=D
# 上線前請用 check-sources 確認每個網址可用，不能用的刪掉或換掉即可，程式不會因單一來源失敗而中斷。
sources:
  rss:
    # --- 歐美評測與科技媒體 ---
    - {name: The Verge, url: "https://www.theverge.com/rss/index.xml", type: media, lang: en}
    - {name: Liliputing, url: "https://liliputing.com/feed", type: media, lang: en}
    - {name: Tom's Hardware, url: "https://www.tomshardware.com/feeds/all", type: review, lang: en}
    - {name: Windows Central, url: "https://www.windowscentral.com/rss", type: media, lang: en}
    - {name: Notebookcheck, url: "https://www.notebookcheck.net/RSS-Feed-Notebook-Reviews.8156.0.html", type: review, lang: en}
    # --- 平台廠 ---
    - {name: NVIDIA Blog, url: "https://blogs.nvidia.com/feed/", type: official, lang: en}
    # --- 面板與產業 ---
    - {name: TheElec, url: "https://www.thelec.net/rss/allArticle.xml", type: media, lang: en}
    # --- 亞洲媒體 ---
    - {name: 科技新報, url: "https://technews.tw/feed/", type: media, lang: zh-TW}
    - {name: IT之家, url: "https://www.ithome.com/rss/", type: media, lang: zh-CN}
    - {name: PC Watch, url: "https://pc.watch.impress.co.jp/data/rss/1.0/pcw/feed.rdf", type: media, lang: ja}
    # --- 社群 ---
    - {name: Reddit r/laptops, url: "https://www.reddit.com/r/laptops/new/.rss", type: social, lang: en}
    - {name: Reddit r/OLED, url: "https://www.reddit.com/r/OLED/new/.rss", type: social, lang: en}

  # Google 新聞搜尋（免費、跨語言），每組查詢會在各語系各跑一次
  google_news:
    locales:
      - {hl: en-US, gl: US, ceid: "US:en", lang: en}
      - {hl: zh-TW, gl: TW, ceid: "TW:zh-Hant", lang: zh-TW}
      - {hl: zh-CN, gl: CN, ceid: "CN:zh-Hans", lang: zh-CN}
      - {hl: ja, gl: JP, ceid: "JP:ja", lang: ja}
      - {hl: ko, gl: KR, ceid: "KR:ko", lang: ko}
    queries:
      en: ["laptop OLED display", "laptop display panel", "notebook Mini LED", "laptop 240Hz display", "IT OLED fab", "G-SYNC laptop", "FreeSync laptop display"]
      zh-TW: ["筆電 OLED 螢幕", "筆電 面板", "OLED 世代線"]
      zh-CN: ["笔记本 OLED 屏幕", "笔记本 屏幕 面板", "OLED 8.6代线", "机械革命 屏幕"]
      ja: ["ノートPC 有機EL", "ノートPC 液晶"]
      ko: ["노트북 OLED", "IT OLED 8.6세대"]

  # Tavily 搜尋 API（選用，需 TAVILY_API_KEY）：可抓到文章全文，規格細節會多很多
  # 每次執行用幾個查詢由上方 collection 設定決定；平日會輪流使用，週日全部使用
  tavily:
    max_results: 20
    queries:
      # --- 新機與規格 ---
      - "new laptop OLED display specs"
      - "laptop display refresh rate nits announced"
      - "laptop Mini LED display"
      - "Tandem OLED laptop"
      - "laptop 2.8K 3K OLED 120Hz"
      - "laptop 240Hz 300Hz display gaming"
      - "laptop display PWM dimming flicker"
      - "laptop display DCI-P3 Delta E color accuracy"
      - "all-in-one PC display announced"
      - "laptop touchscreen OLED convertible"
      # --- 品牌 ---
      - "ASUS Zenbook Vivobook ROG display"
      - "Lenovo Yoga ThinkPad Legion display"
      - "HP Spectre OmniBook OMEN display"
      - "Dell XPS Alienware display"
      - "Acer Swift Predator display"
      - "MSI laptop display"
      - "Samsung Galaxy Book display"
      - "Apple MacBook display"
      - "Razer Blade display"
      - "Microsoft Surface Laptop display"
      - "LG gram display"
      - "Huawei MateBook Xiaomi Honor laptop display"
      # --- 評測與拆機 ---
      - "laptop review display panel measured"
      - "laptop display panel model teardown"
      # --- 面板廠與產線 ---
      - "Samsung Display laptop OLED panel"
      - "LG Display laptop panel"
      - "BOE notebook OLED panel"
      - "AUO Innolux notebook panel"
      - "Gen 8.6 IT OLED production"
      - "IT OLED capacity investment"
      # --- 平台廠 ---
      - "Intel laptop display technology"
      - "NVIDIA G-SYNC laptop display"
      - "AMD FreeSync laptop display"
      - "Qualcomm Snapdragon laptop display"
      - "Intel LRR low refresh rate laptop display"
      - "DPST OPST panel self refresh laptop power"
      # --- 多語系 ---
      - "筆電 OLED 螢幕 規格"
      - "筆電 面板 友達 群創"
      - "笔记本 屏幕 刷新率 面板"
      - "笔记本 OLED 京东方 维信诺"
      - "机械革命 笔记本 屏幕 参数"
      - "ノートPC 有機EL ディスプレイ"
      - "노트북 OLED 디스플레이"
      # --- 傳聞 ---
      - "laptop display leak rumor"
      - "upcoming laptop OLED panel supply chain"
    # 展會月加碼用的查詢
    event_queries:
      - "CES laptop display"
      - "CES OLED laptop"
      - "Computex laptop display"
      - "Computex OLED notebook"
      - "IFA laptop display"
      - "trade show new laptop screen"
      - "laptop announced display specifications"
      - "AIO PC announced display"
      - "notebook panel showcase OLED"
      - "展會 筆電 螢幕"

# 歷史回溯：補建過去幾季的新機資料，讓季度趨勢可以比較
# start_on 之後每次蒐集順便做一點；也可手動執行（profile 選 backfill）立刻開始
backfill:
  enabled: true
  start_on: "2026-11-01"
  quarters: ["2026 Q3", "2026 Q2", "2026 Q1", "2025 Q4"]   # 由近到遠處理
  tavily_per_run: 12            # 每次最多用幾次 Tavily
  monthly_tavily_budget: 160    # 回溯每月最多用幾次 Tavily（另受全體月上限保護）
  units_per_run: 30
  max_results: 15
  events: {1: CES, 2: Computex, 3: IFA}   # 各季的大展（第 4 季沒有就留空）
  tavily_queries:
    - "{event} laptop OLED display"
    - "{event} gaming laptop display 240Hz"
    - "{event} new laptops screen specs"
    - "new laptop announced display specs"
    - "laptop OLED display announced"
    - "laptop Mini LED display announced"
    - "laptop review display panel measured"
    - "ASUS Zenbook ROG laptop display announced"
    - "Lenovo Yoga ThinkPad Legion display announced"
    - "HP OmniBook OMEN EliteBook display announced"
    - "Dell XPS Alienware display announced"
    - "Acer MSI Razer laptop display announced"
    - "Apple MacBook LG gram Samsung Galaxy Book display"
    - "笔记本 新品 发布 屏幕 OLED"
    - "机械革命 新品 屏幕"
  google_news_queries:            # 免費，只有摘要
    - {q: "laptop OLED display", lang: en, hl: en-US, gl: US, ceid: "US:en"}
    - {q: "laptop display panel", lang: en, hl: en-US, gl: US, ceid: "US:en"}
    - {q: "筆電 螢幕 面板", lang: zh-TW, hl: zh-TW, gl: TW, ceid: "TW:zh-Hant"}
    - {q: "笔记本 屏幕", lang: zh-CN, hl: zh-CN, gl: CN, ceid: "CN:zh-Hans"}

