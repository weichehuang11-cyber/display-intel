  - {brand: Mechrevo, model: 耀世, aliases: [Yaoshi], lang: zh}

# 文章初篩關鍵字（不分大小寫）。標題或摘要需「同時」命中兩組才會送進 AI，節省成本。
keywords:
  device: [laptop, notebook, "all-in-one", aio, ultrabook, "2-in-1", 筆電, 笔记本, 筆記型, 一體機, 一体机, ノートPC, ノートパソコン, 노트북]
  display: [display, screen, panel, oled, lcd, "mini led", "mini-led", ips, nits, hz, refresh, hdr, pwm, 螢幕, 屏幕, 面板, 屏, 液晶, 有機el, ディスプレイ, 디스플레이, 패널]
  platform_vendor: [intel, nvidia, amd, qualcomm, snapdragon, "g-sync", freesync, optimus, evo]
  panel_maker: [boe, auo, innolux, "samsung display", "lg display", sharp, csot, tianma, visionox, 京東方, 京东方, 友達, 友达, 群創, 群创, 華星, 华星, 天馬, 天马, 维信诺]
  fab: [fab, "gen 8.6", "8.6-gen", "8.6세대", "8.6代", "g8.6", "generation", capacity, 產線, 产线, 世代線, 代线, 量產, 量产]

report:
  subject_prefix: "[顯示器情報週報]"
  ongoing_days: 30          # 「持續討論中」回看天數
  mobile_cards: 8           # 手機版「新機詳細規格」只顯示前幾款（有亮點、資料最完整的優先）
  output_dir: output
  database: data/intel.sqlite

# 人工更正：你確認過的資訊寫在這裡，以「人工更正」為準，網路資料不能覆蓋
# 改完存檔，下一次蒐集或週報就生效；週報「規格更新」會列出被更正的項目
# - brand / model：照週報上的名稱（大小寫、空白、括號內料號都不影響比對）
# - match（選填）：只更正特定螢幕選配，例如 {size_inch: 16, res_w: 2560}
# - set：要設定的欄位與數值；設成 null 代表「確認是錯的，保持空白」
#   常用欄位：panel_maker 面板廠、panel_model 面板型號、panel_tech 面板技術、refresh_hz 刷新率、
#   sdr_nits 亮度、dci_p3_pct DCI-P3、surface 表面處理、touch 觸控（true/false）、response_ms 反應時間
# - note：資訊來源說明（會顯示在報告的出處）
corrections: []
# 範例（把 corrections: [] 改成下面的格式）：
# corrections:
#   - brand: HP
#     model: OMEN 16
#     match: {res_w: 2560}
#     set: {panel_maker: BOE, panel_model: NE160QDM-NZ1}
#     note: 供應鏈確認 2026-10

# 面板型號的解析度代碼（尺寸數字後面兩個字母，例如 LP160WQ1 的 WQ、NE160WUM 的 WU）
# 用途：文章沒寫解析度時推算（標 *）、和報導不符時在健康檢查提醒、判斷面板型號屬於哪個螢幕選配
# 可自行增加；只適用某家面板廠時寫成「面板廠:代碼」，例如 "AUO:UA": 1920x1200
panel_res_codes:
  WU: 1920x1200
  WQ: 2560x1600

# 價格帶：起價換算美元後分組（週報「價位帶 × 規格」與季度趨勢的「價格帶」）
price:
  bands_usd: [800, 1200, 1800, 2500]   # 分界：800 以下、800–1,199、1,200–1,799、1,800–2,499、2,500 以上
  fx_to_usd:                           # 概略匯率（1 單位外幣 = 多少美元），可自行更新
    TWD: 0.031
    CNY: 0.14
    EUR: 1.08
    JPY: 0.0067
    GBP: 1.27
    KRW: 0.00073
    INR: 0.012

# 週報最後的「系統健康與資料查核」（全部由程式檢查，不花 AI 與 Tavily 額度）
health:
  collect_weekdays: [0, 1, 2, 4, 6]   # 預期執行的日子（0=週一 … 6=週日；週二是規格補完），沒跑會提醒
  audit_samples: 5                 # 每週隨機抽幾款，列出數值＋原文給你人工核對
  # 確認過「不是同一款、分開列」的機型名稱（健康檢查不再提醒可能重複）
  not_duplicates:
    - ["Vivobook S16 M3607GA", "Vivobook S16 M3607KA"]
    - ["HyperX Omen 16", "HyperX Omen Max 16"]
